<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Portfolio{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script data-goatcounter="https://sumon.cloudola.top/count"
        async src="//gc.zgo.at/count.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    
    <!-- Custom Config for Tailwind -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#64748b',
                    }
                }
            }
        }
    </script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">

    <!-- Navigation -->
    <nav class="fixed w-full z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-white tracking-tighter">SP<span class="text-blue-500">.</span></a>
            
            <div class="hidden md:flex space-x-8 text-sm font-medium text-slate-300">
                <a href="#hero" class="hover:text-blue-400 transition">Hero</a>
                <a href="#status" class="hover:text-blue-400 transition">Status</a>
                <a href="#experience" class="hover:text-blue-400 transition">Experience</a>
                <a href="#skills" class="hover:text-blue-400 transition">Skills</a>
                <a href="#contact" class="hover:text-blue-400 transition">Contact</a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="bg-slate-900 text-slate-400 py-8 text-center border-t border-slate-800">
        <p>&copy; 2026 {{ config.name }} | Built with Flask & Tailwind</p>
    </footer>

    <!-- Terminal Script -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const terminalInput = document.getElementById('terminal-input');
            const terminalOutput = document.getElementById('terminal-output');
            
            if(terminalInput && terminalOutput) {
                terminalInput.addEventListener('keypress', function(e) {
                    if (e.key === 'Enter') {
                        const cmd = this.value.trim().toLowerCase();
                        let response = '';
                        
                        // Command Logic
                        switch(cmd) {
                            case 'help': response = 'Commands: whoami, skills, contact, status, clear'; break;
                            case 'whoami': response = 'Sumon Paul - DevOps Engineer | 9+ Years Exp.'; break;
                            case 'skills': response = 'AWS, Docker, K8s, Ansible, Terraform, Python, Linux'; break;
                            case 'contact': response = 'Email: sumonpaul461@gmail.com | LinkedIn: /in/sumonpaul'; break;
                            case 'status': response = '[✓] All systems operational | Uptime: 99.9%'; break;
                            case 'clear': 
                                terminalOutput.innerHTML = '<div class="flex items-center"><span class="mr-2 text-green-500">$</span><input type="text" id="terminal-input" class="bg-transparent border-none outline-none text-white flex-1 font-mono" placeholder="Type help..." autocomplete="off"></div>';
                                reattachListener();
                                return;
                            default: response = `Command not found: ${cmd}. Type 'help'.`;
                        }
                        
                        // Append Command
                        const cmdLine = document.createElement('div');
                        cmdLine.className = 'mb-1';
                        cmdLine.innerHTML = `<span class="text-green-500">$</span> ${this.value}`;
                        
                        // Append Response
                        const respLine = document.createElement('div');
                        respLine.className = 'mb-3 text-slate-300';
                        respLine.textContent = response;
                        
                        terminalOutput.insertBefore(respLine, terminalOutput.lastElementChild);
                        terminalOutput.insertBefore(cmdLine, terminalOutput.lastElementChild);
                        
                        this.value = '';
                        terminalOutput.scrollTop = terminalOutput.scrollHeight;
                    }
                });
            }

            function reattachListener() {
                const newInput = document.getElementById('terminal-input');
                if(newInput) {
                    newInput.focus();
                    newInput.addEventListener('keypress', arguments.callee.caller);
                }
            }
        });
    </script>
</body>
</html>
