<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ config.hero.title }} | DevOps Engineer</title>
    
    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-dark text-light">
    <!-- Navigation -->
    <nav id="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">
                <i class="fas fa-terminal me-2 text-primary"></i>DevOpsPortfolio
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#hero">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#skills">Skills</a></li>
                    <li class="nav-item"><a class="nav-link" href="#experience">Experience</a></li>
                    <li class="nav-item"><a class="nav-link" href="#projects">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="#contact">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    {% block content %}{% endblock %}

    <!-- Footer -->
    <footer class="bg-black py-5">
        <div class="container text-center">
            <div class="social-links mb-4">
                {% for link in config.social_links %}
                <a href="{{ link.url }}" class="btn btn-lg btn-dark rounded-circle mx-2 hover-lift">
                    <i class="{{ link.icon }} fa-fw"></i>
                </a>
                {% endfor %}
            </div>
            <p class="mb-0 text-muted">&copy; 2023 {{ config.hero.title }}. All rights reserved</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    
    <!-- GitHub Stats Script -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('/github-stats')
            .then(response => response.json())
            .then(data => {
                const statsContainer = document.getElementById('github-stats');
                statsContainer.innerHTML = `
                    <div class="col-md-3 col-6">
                        <div class="stat-card bg-dark p-3 rounded-3">
                            <h3 class="text-primary">${data.repos}</h3>
                            <p class="mb-0 text-muted">Repositories</p>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="stat-card bg-dark p-3 rounded-3">
                            <h3 class="text-primary">${data.stars}</h3>
                            <p class="mb-0 text-muted">Stars</p>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="stat-card bg-dark p-3 rounded-3">
                            <h3 class="text-primary">${data.followers}</h3>
                            <p class="mb-0 text-muted">Followers</p>
                        </div>
                    </div>
                    <div class="col-md-3 col-6">
                        <div class="stat-card bg-dark p-3 rounded-3">
                            <h3 class="text-primary">${data.contributions}</h3>
                            <p class="mb-0 text-muted">Contributions</p>
                        </div>
                    </div>
                `;
            });
    });
    </script>
</body>
</html>
